<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <link rel="icon" href="/images/noc_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1d96f0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta data-rh="true" name="description" content="Nile Orphan Care supports orphaned and vulnerable children in South Sudan through education, child protection, nutrition, healthcare and youth empowerment." />
    <link data-rh="true" rel="canonical" href="https://www.nileorphancare.org/" />

    <!-- Open Graph / social sharing defaults. Per-page titles and
         descriptions are set via react-helmet-async at runtime for
         browsers and JS-rendering crawlers (e.g. Googlebot); these
         static tags are the fallback seen by crawlers that don't
         execute JavaScript (e.g. some link-preview bots). The
         data-rh="true" marker lets react-helmet-async claim and
         replace these exact tags per route instead of duplicating
         them — without it, Helmet just appends new tags and the
         static ones (seen first) keep winning in the DOM. -->
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:site_name" content="Nile Orphan Care" />
    <meta data-rh="true" property="og:title" content="Nile Orphan Care | Supporting Vulnerable Children in South Sudan" />
    <meta data-rh="true" property="og:description" content="Nile Orphan Care supports orphaned and vulnerable children in South Sudan through education, child protection, nutrition, healthcare and youth empowerment." />
    <meta data-rh="true" property="og:url" content="https://www.nileorphancare.org/" />
    <meta data-rh="true" property="og:image" content="https://www.nileorphancare.org/images/noc_logo.png" />

    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:title" content="Nile Orphan Care | Supporting Vulnerable Children in South Sudan" />
    <meta data-rh="true" name="twitter:description" content="Nile Orphan Care supports orphaned and vulnerable children in South Sudan through education, child protection, nutrition, healthcare and youth empowerment." />
    <meta data-rh="true" name="twitter:image" content="https://www.nileorphancare.org/images/noc_logo.png" />

    <title>Nile Orphan Care | Supporting Vulnerable Children in South Sudan</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
